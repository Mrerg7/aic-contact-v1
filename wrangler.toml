name = "aic-contact-v1"
main = "src/worker.ts"
compatibility_date = "2026-06-25"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "aic.contact"
custom_domain = true

[[routes]]
pattern = "www.aic.contact"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Worker must run BEFORE assets so www/http 301s actually fire.
# Default asset-first routing was bypassing the redirect logic in worker.ts,
# which caused the "Alternate page with proper canonical tag" GSC issue.
run_worker_first = true
